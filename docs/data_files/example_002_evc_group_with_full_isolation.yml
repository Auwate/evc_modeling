evc_group:
  name: MyGroup
  intent:
    bandwidth: 20
    isolation: FULL
    enforcement: COMPLETE
  evcs:
    - name: EVC1
      unis:
        uni_1:
          device: Ampath1
          interface: 15
          tag:
            type: VLAN
            value: 100
        uni_2:
          device: Ampath2
          interface: 15
          tag:
            type: VLAN
            value: 100
    - name: EVC2
      unis:
        uni_1:
          device: sw2
          interface: 1
          tag:
            type: range
            value: '[100, 200]'
        uni_2:
          device: sw3
          interface: eth0
          tag:
            type: range
            value: "[100, 200]"